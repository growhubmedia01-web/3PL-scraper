name: 3PL Autopilot Cron

on:
  schedule:
    # Runs every hour at minute 0. 
    # Change to '*/30 * * * *' for every 30 minutes, etc.
    - cron: '0 * * * *'
  workflow_dispatch: # This allows you to also trigger it manually from the GitHub UI

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Discovery (Find new companies)
        run: |
          curl -X POST https://threepl-scraper.onrender.com/api/discovery/run \
            -H "Content-Type: application/json" \
            -d '{"limit": 25}'
            
      - name: Process Queue (Crawl & Analyze)
        run: |
          curl -X POST "https://threepl-scraper.onrender.com/api/pipeline/process-queue?limit=25" \
            -H "Content-Type: application/json" \
            -d '{}'
