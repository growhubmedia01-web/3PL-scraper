name: 3PL Autopilot Cron

on:
  # Scheduled runs are handled by cron-job.org instead (console.cron-job.org)
  # to avoid two independent schedulers hitting /api/pipeline/process-queue
  # at once, which was causing DB row-lock contention and AI-provider rate-limit
  # bursts. Kept as workflow_dispatch only, for manual/on-demand runs.
  workflow_dispatch:

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render service
        run: |
          curl --max-time 60 https://threepl-scraper.onrender.com/health || true

      - name: Trigger Discovery (Find new companies)
        run: |
          curl --max-time 60 -X POST https://threepl-scraper.onrender.com/api/discovery/run \
            -H "Content-Type: application/json" \
            -d '{"limit": 25}'

      - name: Wait for discovery to complete
        run: sleep 30

      - name: Process Queue (Crawl and Score companies)
        run: |
          curl --max-time 260 -X POST "https://threepl-scraper.onrender.com/api/pipeline/process-queue?limit=25&max_seconds=240" \
            -H "Content-Type: application/json" \
            -d '{}'
