# Local development: Redis for Celery. Postgres is Supabase (remote).
# Uncomment the postgres service to run fully offline.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

